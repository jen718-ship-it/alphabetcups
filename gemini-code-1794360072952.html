<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Which cup is it?</title>
  <!-- Google Fonts: Load Fredoka for Title only -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #f0f7ff;
      --card-bg: #ffffff;
      --table-top: #ffcb2b;
      --table-wood: #f5a623;
      --accent-pink: #ff3366;
      --accent-blue: #00bcd4;
      --accent-green: #4caf50;
      --accent-yellow: #ffeb3b;
      --text-dark: #2c3e50;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
      overflow-x: hidden;
    }

    /* Header */
    header {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    /* Title uses Fredoka exclusively */
    h1.game-title {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      color: var(--accent-pink);
      text-shadow: 3px 3px 0px #000;
      letter-spacing: 2px;
      text-align: center;
      flex-grow: 1;
    }

    /* Enhanced 3D Glass Arcade Buttons */
    .icon-btn {
      background: linear-gradient(180deg, #ff527b 0%, var(--accent-pink) 100%);
      border: 4px solid #000;
      border-radius: 22px;
      width: 68px;
      height: 68px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 8px 0 #000, 0 12px 16px rgba(0,0,0,0.15);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      position: relative;
    }

    .icon-btn::after {
      content: '';
      position: absolute;
      top: 4px;
      left: 8px;
      right: 8px;
      height: 12px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 10px;
    }

    .icon-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #000, 0 4px 6px rgba(0,0,0,0.15);
    }

    .icon-btn svg {
      width: 36px;
      height: 36px;
      fill: #fff;
      filter: drop-shadow(0 2px 0 rgba(0,0,0,0.3));
    }

    .icon-btn.blue { background: linear-gradient(180deg, #33c9fc 0%, var(--accent-blue) 100%); }
    .icon-btn.green { background: linear-gradient(180deg, #66bb6a 0%, var(--accent-green) 100%); }
    .icon-btn.yellow { background: linear-gradient(180deg, #fff176 0%, var(--accent-yellow) 100%); }
    .icon-btn.yellow svg { fill: #000; filter: none; }

    /* Stage Container Design */
    .game-container {
      width: 100%;
      max-width: 1000px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .stage {
      width: 100%;
      min-height: 450px;
      background: linear-gradient(180deg, #ffffff 0%, #eef7ff 100%);
      border-radius: 40px;
      border: 6px solid #000;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 25px;
      box-shadow: 0 12px 0 #000, inset 0 -6px 0 rgba(0,0,0,0.05);
      overflow: hidden;
    }

    /* Wood Table Surface */
    .stage::after {
      content: '';
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 70px;
      background: linear-gradient(180deg, var(--table-top) 0%, var(--table-wood) 100%);
      border-top: 6px solid #000;
      box-shadow: inset 0 6px 0 rgba(255,255,255,0.4);
    }

    /* Centered Cup Track */
    .cups-area {
      position: relative;
      width: 100%;
      height: 340px;
      overflow-x: auto;
      overflow-y: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .cups-wrapper {
      position: relative;
      height: 100%;
      margin: 0 auto;
    }

    .cup-slot {
      position: absolute;
      bottom: 25px;
      width: 130px;
      height: 270px;
      transition: left 0.45s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 2;
    }

    .cup-graphic {
      position: relative;
      width: 100%;
      height: 200px;
      transition: transform 0.4s ease;
      z-index: 3;
    }

    .cup-slot.lifted .cup-graphic {
      transform: translateY(-120px);
    }

    /* Glass 3D Red Cup SVG Styling */
    .red-cup-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0px 10px 0px rgba(0,0,0,0.18));
    }

    /* Glass 3D Letter Badge */
    .letter-badge {
      position: absolute;
      top: 52%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: linear-gradient(180deg, #ffffff 0%, #f0f0f0 100%);
      color: #d32f2f;
      font-size: 2.2rem;
      font-weight: 900;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 4px solid #000;
      box-shadow: 0 5px 0 #000;
      z-index: 5;
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
      position: absolute;
    }

    /* Curved Glass Glare Highlight for Badge */
    .letter-badge::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 6px;
      right: 6px;
      height: 14px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 10px;
      pointer-events: none;
    }

    .cup-slot.show-badge .letter-badge {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    /* Prize inside Cup */
    .prize {
      position: absolute;
      bottom: 35px;
      font-size: 4.2rem;
      z-index: 1;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .cup-slot.lifted .prize {
      visibility: visible;
      opacity: 1;
    }

    /* Glass 3D Feedback Banner */
    .feedback-banner {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: linear-gradient(180deg, #fff59d 0%, var(--accent-yellow) 100%);
      color: #000;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 900;
      padding: 15px 45px;
      border-radius: 35px;
      border: 6px solid #000;
      box-shadow: 0 10px 0 #000;
      z-index: 20;
      text-align: center;
      pointer-events: none;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      white-space: nowrap;
      position: absolute;
    }

    .feedback-banner::after {
      content: '';
      position: absolute;
      top: 6px;
      left: 15px;
      right: 15px;
      height: 16px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 12px;
    }

    .feedback-banner.show {
      transform: translate(-50%, -50%) scale(1);
    }

    /* Controls Bar */
    .controls-bar {
      margin-top: 15px;
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .status-tracker {
      display: flex;
      gap: 15px;
      align-items: center;
      background: linear-gradient(180deg, #ffffff 0%, #f7fafc 100%);
      padding: 12px 24px;
      border-radius: 22px;
      border: 4px solid #000;
      box-shadow: 0 6px 0 #000;
      position: relative;
    }

    .status-tracker::after {
      content: '';
      position: absolute;
      top: 4px;
      left: 10px;
      right: 10px;
      height: 10px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 8px;
    }

    .hearts-container {
      display: flex;
      gap: 5px;
      font-size: 1.8rem;
    }

    .rounds-indicator {
      font-size: 1.5rem;
      font-weight: 900;
      color: #000;
    }

    /* Teacher Setup Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--card-bg);
      border: 6px solid #000;
      border-radius: 30px;
      padding: 25px;
      width: 90%;
      max-width: 620px;
      box-shadow: 0 10px 0 #000;
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-card h2 {
      color: #000;
      text-align: center;
      font-size: 1.8rem;
    }

    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .setting-group label {
      font-weight: bold;
      color: #000;
      font-size: 1.1rem;
    }

    .setting-options {
      display: flex;
      gap: 10px;
    }

    .opt-btn {
      flex: 1;
      padding: 12px;
      background: #f0f4f8;
      border: 3.5px solid #000;
      color: #000;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 4px 0 #000;
    }

    .opt-btn.selected {
      background: var(--accent-yellow);
    }

    .letter-picker-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      background: #f8fafc;
      padding: 12px;
      border-radius: 16px;
      border: 3.5px solid #000;
      max-height: 180px;
      overflow-y: auto;
    }

    .letter-chip {
      background: #ffffff;
      border: 2px solid #000;
      border-radius: 10px;
      padding: 8px 0;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 3px 0 #000;
    }

    .letter-chip.selected {
      background: var(--accent-pink);
      color: #fff;
    }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      background: #f8fafc;
      padding: 12px;
      border-radius: 16px;
      border: 3.5px solid #000;
      max-height: 120px;
      overflow-y: auto;
    }

    .emoji-item {
      font-size: 1.8rem;
      text-align: center;
      padding: 6px;
      cursor: pointer;
      border-radius: 10px;
      border: 2px solid transparent;
    }

    .emoji-item.selected {
      background: var(--accent-yellow);
      border-color: #000;
    }
  </style>
</head>
<body>

  <!-- Game Header -->
  <header>
    <button class="icon-btn blue" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24">
        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
      </svg>
    </button>

    <h1 class="game-title">Which cup is it?</h1>

    <button class="icon-btn yellow" id="resetBtn" aria-label="Play Again">
      <svg viewBox="0 0 24 24">
        <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
      </svg>
    </button>
  </header>

  <!-- Stage -->
  <div class="game-container">
    <div class="stage" id="stage">
      <div class="cups-area" id="cupsArea">
        <div class="cups-wrapper" id="cupsWrapper"></div>
      </div>
    </div>
    
    <div class="feedback-banner" id="feedbackBanner">Very Good!</div>
  </div>

  <!-- Bottom Control Bar -->
  <div class="controls-bar">
    <button class="icon-btn green" id="shuffleBtn" aria-label="Shuffle Cups">
      <svg viewBox="0 0 24 24">
        <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
      </svg>
    </button>

    <div class="status-tracker">
      <div class="hearts-container" id="heartsContainer">❤️❤️</div>
      <div class="rounds-indicator" id="roundsIndicator">1 / 5</div>
    </div>
  </div>

  <!-- Teacher Setup Modal -->
  <div class="modal-overlay" id="setupModal">
    <div class="modal-card">
      <h2>⚙️ Teacher Setup</h2>

      <div class="setting-group">
        <label>Select Letters to Include (Aa - Zz)</label>
        <div class="letter-picker-grid" id="letterPickerGrid"></div>
      </div>

      <div class="setting-group">
        <label>Rounds Per Game</label>
        <div class="setting-options" id="roundOptions">
          <div class="opt-btn selected" data-value="5">5 Rounds</div>
          <div class="opt-btn" data-value="10">10 Rounds</div>
        </div>
      </div>

      <div class="setting-group">
        <label>Hidden Object Inside Cup</label>
        <div class="emoji-grid" id="emojiGrid"></div>
      </div>

      <button class="icon-btn green" id="saveSettingsBtn" style="width: 100%; border-radius: 16px;" aria-label="Save Settings">
        <svg viewBox="0 0 24 24" style="width:40px; height:40px;">
          <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    /* Glass 3D Red Cup SVG Template with Specular Highlights & Glossy Curves */
    const RED_CUP_SVG = `
    <svg class="red-cup-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 460">
      <defs>
        <linearGradient id="cupRed3D" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#990c12"/>
          <stop offset="20%" stop-color="#d32f2f"/>
          <stop offset="45%" stop-color="#ff5252"/>
          <stop offset="70%" stop-color="#e53935"/>
          <stop offset="100%" stop-color="#800a0e"/>
        </linearGradient>
        <linearGradient id="cupRim3D" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="50%" stop-color="#e0e0e0"/>
          <stop offset="100%" stop-color="#90a4ae"/>
        </linearGradient>
        <linearGradient id="glassGlare" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
          <stop offset="25%" stop-color="#ffffff" stop-opacity="0.65"/>
          <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      
      <!-- Main Outer Cup Body with 3D Red Gradient -->
      <path d="M 35 420 L 72 60 A 15 8 0 0 1 85 53 L 275 53 A 15 8 0 0 1 288 60 L 325 420 Z" fill="url(#cupRed3D)" stroke="#000000" stroke-width="8"/>
      
      <!-- Vertical Curved Glass Specular Highlight (Left Gloss Band) -->
      <path d="M 50 415 L 82 65 Q 115 65 110 415 Z" fill="url(#glassGlare)" opacity="0.8"/>
      
      <!-- Top Secondary Glass Glare -->
      <path d="M 85 62 L 275 62 C 240 75, 120 75, 85 62 Z" fill="#ffffff" opacity="0.35"/>
      
      <!-- Bottom Rim Lip with 3D Bevel -->
      <ellipse cx="180" cy="420" rx="145" ry="16" fill="url(#cupRim3D)" stroke="#000000" stroke-width="6"/>
      <ellipse cx="180" cy="420" rx="140" ry="10" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7"/>

      <!-- Plastic Rib Ridges with 3D Shadow/Highlight Pairings -->
      <path d="M 68 105 C 120 97, 240 97, 292 105" fill="none" stroke="#5c0002" stroke-width="4"/>
      <path d="M 68 107 C 120 99, 240 99, 292 107" fill="none" stroke="#ff8a80" stroke-width="2" opacity="0.6"/>

      <path d="M 62 160 C 120 150, 240 150, 298 160" fill="none" stroke="#5c0002" stroke-width="4"/>
      <path d="M 62 162 C 120 152, 240 152, 298 162" fill="none" stroke="#ff8a80" stroke-width="2" opacity="0.6"/>

      <path d="M 59 195 C 120 184, 240 184, 301 195" fill="none" stroke="#5c0002" stroke-width="4"/>
      <path d="M 59 197 C 120 186, 240 186, 301 197" fill="none" stroke="#ff8a80" stroke-width="2" opacity="0.6"/>

      <path d="M 56 230 C 120 218, 240 218, 304 230" fill="none" stroke="#5c0002" stroke-width="4"/>
      <path d="M 56 232 C 120 220, 240 220, 304 232" fill="none" stroke="#ff8a80" stroke-width="2" opacity="0.6"/>

      <!-- Sealed Top Surface Plate -->
      <ellipse cx="180" cy="53" rx="100" ry="12" fill="#b71c1c" stroke="#000000" stroke-width="4"/>
      <ellipse cx="180" cy="53" rx="80" ry="8" fill="none" stroke="#ff5252" stroke-width="2" opacity="0.6"/>
    </svg>`;

    const EMOJI_LIST = ['🍎', '🍓', '🧸', '🐶', '🐱', '🚗', '⭐', '🎈', '🍕', '🍩', '🚀', '🦄'];
    const ALL_LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    const STORAGE_KEY = 'which_cup_game_clean_v6';
    
    let config = {
      selectedLetters: ['A', 'B'],
      totalRounds: 5,
      prizeEmoji: '🍎'
    };

    let gameState = {
      currentRound: 1,
      winningCupIndex: -1,
      chancesLeft: 2,
      isShuffling: false,
      hasRevealedInitial: false,
      canGuess: false,
      cups: []
    };

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'lift') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      } else if (type === 'shuffle') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180 + Math.random() * 80, now);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'win') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.setValueAtTime(600, now + 0.1);
        osc.frequency.setValueAtTime(800, now + 0.2);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.setValueAtTime(140, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      }
    }

    const cupsArea = document.getElementById('cupsArea');
    const cupsWrapper = document.getElementById('cupsWrapper');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const resetBtn = document.getElementById('resetBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const setupModal = document.getElementById('setupModal');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const feedbackBanner = document.getElementById('feedbackBanner');
    const heartsContainer = document.getElementById('heartsContainer');
    const roundsIndicator = document.getElementById('roundsIndicator');
    const emojiGrid = document.getElementById('emojiGrid');
    const letterPickerGrid = document.getElementById('letterPickerGrid');

    function loadCachedSettings() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try { config = { ...config, ...JSON.parse(saved) }; } catch (e) {}
      }
    }

    function saveSettingsToCache() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
    }

    function initLetterPicker() {
      letterPickerGrid.innerHTML = '';
      ALL_LETTERS.forEach(uppercase => {
        const chip = document.createElement('div');
        const lowercase = uppercase.toLowerCase();
        chip.className = `letter-chip ${config.selectedLetters.includes(uppercase) ? 'selected' : ''}`;
        chip.textContent = `${uppercase}${lowercase}`;
        chip.onclick = () => {
          if (config.selectedLetters.includes(uppercase)) {
            if (config.selectedLetters.length > 1) {
              config.selectedLetters = config.selectedLetters.filter(l => l !== uppercase);
              chip.classList.remove('selected');
            }
          } else {
            config.selectedLetters.push(uppercase);
            chip.classList.add('selected');
          }
        };
        letterPickerGrid.appendChild(chip);
      });
    }

    function initEmojiGrid() {
      emojiGrid.innerHTML = '';
      EMOJI_LIST.forEach(emoji => {
        const item = document.createElement('div');
        item.className = `emoji-item ${config.prizeEmoji === emoji ? 'selected' : ''}`;
        item.textContent = emoji;
        item.onclick = () => {
          document.querySelectorAll('.emoji-item').forEach(el => el.classList.remove('selected'));
          item.classList.add('selected');
          config.prizeEmoji = emoji;
        };
        emojiGrid.appendChild(item);
      });
    }

    function startNewGame() {
      gameState.currentRound = 1;
      setupRound();
    }

    function setupRound() {
      gameState.chancesLeft = 2;
      gameState.isShuffling = false;
      gameState.hasRevealedInitial = false;
      gameState.canGuess = false;
      
      updateUI();
      renderCups();

      setTimeout(() => {
        revealWinnerCupInitial();
      }, 600);
    }

    function updateUI() {
      heartsContainer.textContent = '❤️'.repeat(gameState.chancesLeft);
      roundsIndicator.textContent = `${gameState.currentRound} / ${config.totalRounds}`;
      feedbackBanner.classList.remove('show');
    }

    function renderCups() {
      cupsWrapper.innerHTML = '';
      
      let cupLabels = [];
      config.selectedLetters.forEach(L => {
        cupLabels.push(L);
        cupLabels.push(L.toLowerCase());
      });

      const totalCups = cupLabels.length;
      gameState.winningCupIndex = Math.floor(Math.random() * totalCups);

      const cupWidth = 130;
      const spacing = 25;
      const totalWidthNeeded = totalCups * cupWidth + (totalCups + 1) * spacing;
      
      cupsWrapper.style.width = `${totalWidthNeeded}px`;

      gameState.cups = [];

      for (let i = 0; i < totalCups; i++) {
        const isWinner = i === gameState.winningCupIndex;
        const leftPos = spacing + i * (cupWidth + spacing);

        const slot = document.createElement('div');
        slot.className = 'cup-slot';
        slot.style.left = `${leftPos}px`;
        slot.dataset.index = i;

        slot.innerHTML = `
          <div class="prize">${isWinner ? config.prizeEmoji : ''}</div>
          <div class="cup-graphic">
            ${RED_CUP_SVG}
            <div class="letter-badge">${cupLabels[i]}</div>
          </div>
        `;

        slot.onclick = () => handleCupClick(i);
        cupsWrapper.appendChild(slot);

        gameState.cups.push({
          element: slot,
          slotIndex: i,
          isWinner: isWinner
        });
      }
    }

    function revealWinnerCupInitial() {
      const winningCup = gameState.cups[gameState.winningCupIndex];
      winningCup.element.classList.add('lifted');
      playSound('lift');

      setTimeout(() => {
        winningCup.element.classList.remove('lifted');
        gameState.hasRevealedInitial = true;
      }, 1800);
    }

    function shuffleCups() {
      if (!gameState.hasRevealedInitial || gameState.isShuffling) return;

      gameState.isShuffling = true;
      gameState.canGuess = false;

      // Lower cups and hide badges before shuffle begins
      gameState.cups.forEach(cup => {
        cup.element.classList.remove('lifted');
        cup.element.classList.remove('show-badge');
      });

      const cupWidth = 130;
      const spacing = 25;
      const totalCups = gameState.cups.length;

      let shuffleCount = 0;
      const maxShuffles = 8;

      const interval = setInterval(() => {
        const idx1 = Math.floor(Math.random() * totalCups);
        let idx2 = Math.floor(Math.random() * totalCups);
        while (idx1 === idx2) {
          idx2 = Math.floor(Math.random() * totalCups);
        }

        const tempSlot = gameState.cups[idx1].slotIndex;
        gameState.cups[idx1].slotIndex = gameState.cups[idx2].slotIndex;
        gameState.cups[idx2].slotIndex = tempSlot;

        gameState.cups.forEach(cup => {
          const newLeft = spacing + cup.slotIndex * (cupWidth + spacing);
          cup.element.style.left = `${newLeft}px`;
        });

        playSound('shuffle');
        shuffleCount++;

        if (shuffleCount >= maxShuffles) {
          clearInterval(interval);
          setTimeout(() => {
            gameState.isShuffling = false;
            gameState.canGuess = true;
            // Reveal badges ONLY when shuffling is completely finished
            gameState.cups.forEach(cup => {
              cup.element.classList.add('show-badge');
            });
          }, 450);
        }
      }, 400);
    }

    function handleCupClick(index) {
      if (!gameState.canGuess || gameState.isShuffling) return;

      const clickedCup = gameState.cups[index];
      if (clickedCup.element.classList.contains('lifted')) return;

      clickedCup.element.classList.add('lifted');
      playSound('lift');

      if (clickedCup.isWinner) {
        playSound('win');
        gameState.canGuess = false;
        feedbackBanner.classList.add('show');

        setTimeout(() => {
          nextRound();
        }, 2200);
      } else {
        playSound('wrong');
        gameState.chancesLeft--;
        updateUI();

        if (gameState.chancesLeft === 0) {
          gameState.canGuess = false;
          setTimeout(() => {
            const winningCup = gameState.cups[gameState.winningCupIndex];
            winningCup.element.classList.add('lifted');
            playSound('lift');

            setTimeout(() => {
              nextRound();
            }, 2500);
          }, 800);
        }
      }
    }

    function nextRound() {
      if (gameState.currentRound < config.totalRounds) {
        gameState.currentRound++;
        setupRound();
      } else {
        startNewGame();
      }
    }

    function setupOptionToggles(containerId, configKey) {
      const container = document.getElementById(containerId);
      const buttons = container.querySelectorAll('.opt-btn');
      
      buttons.forEach(btn => {
        if (btn.dataset.value === String(config[configKey])) {
          btn.classList.add('selected');
        } else {
          btn.classList.remove('selected');
        }

        btn.onclick = () => {
          buttons.forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          const val = btn.dataset.value;
          config[configKey] = isNaN(val) ? val : Number(val);
        };
      });
    }

    shuffleBtn.onclick = shuffleCups;
    resetBtn.onclick = startNewGame;

    settingsBtn.onclick = () => {
      setupOptionToggles('roundOptions', 'totalRounds');
      initLetterPicker();
      initEmojiGrid();
      setupModal.classList.add('active');
    };

    saveSettingsBtn.onclick = () => {
      saveSettingsToCache();
      setupModal.classList.remove('active');
      startNewGame();
    };

    loadCachedSettings();
    startNewGame();
  </script>
</body>
</html>
